# U字動作。関節1から4の順に番号を振る。角度は度、周期は秒。
# A: 最大指令角、s: 各関節の動作時間に占める曲げの割合。
# d: 両端の関節の開始遅れ、k: 左右の開始時間差（ともに周期比）、b: 左右の振幅差の割合。
extends: default.yaml
physics:
  tilt_deg: -14.5
  neutral: true
control:
  mode: expressions
  period: 3.0
  expression_period: 1.0
  expressions:
  - A = 65
  - s = 0.75
  - d = 0.12
  - k = -0.25
  - b = 0.7
  - side(n) = (n-1)/3
  - outer(n) = (n-2)*(n-3)/2
  - delay(n) = d*outer(n)+max(0,k*side(n))+max(0,-k*(1-side(n)))
  - amp(n) = A*(1-max(0,b*side(n))-max(0,-b*(1-side(n))))
  - u(t) = t-floor(t)
  - w(n,t) = (u(t)-delay(n))/(1-delay(n))
  - h(v) = (1-cos(pi*min(1,max(0,v))))/2
  - x(n,t) = -amp(n)*(h(w(n,t)/s)-h((w(n,t)-s)/(1-s)))
simulation:
  duration: 60
