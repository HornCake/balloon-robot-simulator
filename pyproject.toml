[project]
name = "balloon-simulation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "mujoco==4.0.1",
    "numpy==2.5.5",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
